name: Native source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/test_swift.sh
      - run: node --test macos/Tests/*.test.mjs
      - run: python3 -B -m unittest discover -s macos/Tests -p 'test_*.py'
